<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tlaloc Meteo</title>
    
    <!-- PWA Meta Tags per l'installabilità -->
    <meta name="theme-color" content="#4ecca3">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="1791289876628.jpg">
    <link rel="manifest" href='data:application/manifest+json,{
        "name": "Tlaloc Meteo",
        "short_name": "Tlaloc",
        "start_url": "index.html",
        "display": "standalone",
        "background_color": "#4ecca3",
        "theme_color": "#4ecca3",
        "icons": [{"src": "1791289876628.jpg", "sizes": "192x192", "type": "image/jpeg"}]
    }'>

    <!-- Tailwind CSS per lo stile -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4ecca3',
                        accent: '#36454F',
                        darkBg: '#1a1a1a',
                    }
                }
            }
        }
    </script>
    <style>
        /* Stile personalizzato per il radar */
        .radar-container {
            position: relative;
            width: 100%;
            padding-top: 75%; /* Aspect Ratio 4:3 */
            overflow: hidden;
            border-radius: 1rem;
        }
        .radar-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        /* Sfondi dinamici */
        body.bg-sunny { background: linear-gradient(to bottom, #4facfe 0%, #00f2fe 100%); }
        body.bg-rainy { background: linear-gradient(to bottom, #203a43 0%, #2c5364 100%); }
        body.bg-cloudy { background: linear-gradient(to bottom, #485563 0%, #29323c 100%); }
        body.bg-night { background: linear-gradient(to bottom, #0f2027 0%, #203a43 0%, #2c5364 100%); }
    </style>
</head>
<body class="bg-sunny text-white font-sans transition-colors duration-500 antialiased" id="appBody">

    <!-- Header -->
    <header class="sticky top-0 z-50 bg-white/10 backdrop-blur-lg border-b border-white/10 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <img src="1791289876628.jpg" alt="Tlaloc Logo" class="w-10 h-10 rounded-full border-2 border-white/20 shadow-sm">
                <h1 class="text-2xl font-bold tracking-tight">Tlaloc<span class="text-primary font-light">Meteo</span></h1>
            </div>
            <div class="flex items-center gap-2">
                <button id="btnLocate" class="p-2.5 bg-primary/20 hover:bg-primary/40 rounded-full transition duration-300">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.243-4.243a8 8 0 1111.314 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                </button>
                <div class="relative">
                    <input type="text" id="cityInput" placeholder="Cerca città..." class="pl-10 pr-4 py-2.5 rounded-full bg-accent/60 text-white placeholder-gray-300 border border-white/10 focus:ring-2 focus:ring-primary focus:border-primary outline-none transition w-40 sm:w-48">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-300 absolute left-3 top-1/2 -translate-y-1/2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                </div>
            </div>
        </div>
    </header>

    <!-- Contenuto Principale -->
    <main class="max-w-7xl mx-auto p-4 sm:p-6 space-y-8">
        
        <!-- Loader -->
        <div id="loader" class="flex justify-center items-center h-96 hidden">
            <div class="animate-spin rounded-full h-16 w-16 border-t-2 border-b-2 border-primary"></div>
        </div>

        <!-- Errore -->
        <div id="errorMessage" class="bg-red-500/80 text-white p-4 rounded-xl shadow-lg text-center hidden">
            Impossibile trovare la località. Riprova.
        </div>

        <!-- Dashboard Principale (nascosta di default) -->
        <div id="weatherDashboard" class="space-y-8 hidden">
            
            <!-- Intestazione Località -->
            <div class="text-center">
                <h2 id="cityName" class="text-4xl sm:text-5xl font-extrabold tracking-tighter drop-shadow-md">--</h2>
                <p id="currentDate" class="text-sm sm:text-base text-white/80 mt-1">--</p>
            </div>

            <!-- Meteo Principale: Icona, Temp e Descrizione -->
            <div class="grid md:grid-cols-3 gap-6 items-center bg-white/5 backdrop-blur-sm p-8 rounded-3xl border border-white/10 shadow-xl">
                <div class="flex flex-col items-center justify-center md:col-span-1">
                    <div id="mainIcon" class="text-9xl drop-shadow-xl mb-3">☀️</div>
                    <p id="weatherDescription" class="text-xl font-medium text-white/90 text-center">--</p>
                </div>
                <div class="flex flex-col items-center justify-center md:col-span-2">
                    <div class="flex items-end gap-2">
                        <span id="temperature" class="text-9xl sm:text-[14rem] font-black tracking-tighter leading-none">--</span>
                        <span class="text-6xl font-light text-white/70 pb-4">°C</span>
                    </div>
                    <div id="feelsLike" class="text-2xl text-white/70 mt-2 font-light">Percepita: --°C</div>
                </div>
            </div>

            <!-- Dati Avanzati: Griglia
